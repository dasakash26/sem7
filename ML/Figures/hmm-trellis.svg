<text x="20" y="288" text-anchor="start" font-size="16" font-weight="700" fill="#172537">Forward: sum the final column → 0.1486</text>
<text x="20" y="313" text-anchor="start" font-size="16" font-weight="700" fill="#172537">Viterbi: best path 1 → 1, joint probability 0.105</text>
