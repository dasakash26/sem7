<svg xmlns="http://www.w3.org/2000/svg" width="520" height="366" viewBox="0 0 520 366" role="img" aria-labelledby="title desc"><title id="title">Fisher LDA turns points into scores</title><desc id="desc">Six points from the notes projected onto x1 plus x2. Class means are 8/3 and 26/3; threshold 17/3.</desc>
