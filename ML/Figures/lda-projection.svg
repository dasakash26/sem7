<text x="18" y="30" text-anchor="start" font-size="20" font-weight="700" fill="#172537">Fisher LDA turns points into scores</text>
<line x1="57" y1="236" x2="211" y2="236" stroke="#172537" stroke-width="1.6" stroke-dasharray="" marker-end="url(#arrow)"/>
<line x1="57" y1="236" x2="57" y2="82" stroke="#172537" stroke-width="1.6" stroke-dasharray="" marker-end="url(#arrow)"/>
