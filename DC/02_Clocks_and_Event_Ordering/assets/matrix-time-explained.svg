<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">How to read a matrix clock at process P1</title>
  <desc id="desc">A three by three matrix. Rows represent whose knowledge is being described and columns represent events at each process. The first row is P1's own vector clock. Cell row P2 column P3 means what P1 believes P2 knows about P3.</desc>
  <rect width="1200" height="660" rx="24" fill="#f8fafc"/>
  <text x="54" y="65" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Reading matrix time at P₁</text>
  <text x="54" y="105" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">Rows say whose knowledge is described; columns say which process's events that knowledge concerns.</text>

  <text x="315" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#334155">events at P₁</text>
  <text x="445" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#334155">events at P₂</text>
  <text x="575" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#334155">events at P₃</text>

  <text x="235" y="232" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d4ed8">P₁ knows</text>
  <text x="235" y="332" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#475569">P₁ thinks P₂ knows</text>
  <text x="235" y="432" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#475569">P₁ thinks P₃ knows</text>

  <rect x="255" y="185" width="390" height="94" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="255" y="285" width="390" height="94" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="255" y="385" width="390" height="94" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="385" y1="185" x2="385" y2="479" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="515" y1="185" x2="515" y2="479" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="517" y="287" width="126" height="90" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>

  <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="320" y="244">5</text><text x="450" y="244">4</text><text x="580" y="244">2</text>
    <text x="320" y="344">3</text><text x="450" y="344">4</text><text x="580" y="344">2</text>
    <text x="320" y="444">2</text><text x="450" y="444">1</text><text x="580" y="444">2</text>
  </g>

  <path d="M650 230 C720 230 710 205 770 205" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="790" y="196" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">M₁[1,*] = [5, 4, 2]</text>
  <text x="790" y="229" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">P₁'s ordinary vector clock:</text>
  <text x="790" y="258" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">it knows 5, 4 and 2 events.</text>

  <path d="M645 330 C720 330 710 350 770 350" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="790" y="339" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#c2410c">M₁[2,3] = 2</text>
  <text x="790" y="372" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">P₁ believes P₂ knows the first</text>
  <text x="790" y="401" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">2 events generated by P₃.</text>

  <rect x="54" y="530" width="1092" height="82" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="82" y="565" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#047857">Why the extra rows?</text>
  <text x="82" y="595" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">They let P₁ decide whether everyone has seen an old update—not merely whether P₁ has seen it.</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
