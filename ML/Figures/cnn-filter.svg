<svg xmlns="http://www.w3.org/2000/svg" width="520" height="338" viewBox="0 0 520 338" role="img" aria-labelledby="title desc"><title id="title">From input patch to pooled output</title><desc id="desc">A 2 by 2 filter slides over a 3 by 3 image. The left patch scores 2. Cross-correlation gives rows 2,-2; ReLU gives rows 2,0; max pooling gives 2.</desc>
